spring.application.name=todo-backend
server.port=8080

# ---------- Database (default: H2 file DB, zero setup) ----------
spring.datasource.url=jdbc:h2:file:./data/tododb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ---------- JWT ----------
# Must be at least 32 characters. Override with env var JWT_SECRET in production!
app.jwt.secret=${JWT_SECRET:change-this-super-secret-key-at-least-32-chars-long}
app.jwt.expiration-ms=86400000

# ---------- File upload ----------
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ---------- CORS ----------
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ---------- Logging ----------
logging.level.root=INFO
logging.level.com.example.todo=DEBUG
